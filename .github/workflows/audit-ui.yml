name: Public UI link and control audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit-ui.mjs"
      - ".github/workflows/audit-ui.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit visible links, routes and controls on desktop and mobile (read only)
        run: node scripts/audit-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signallayer-ui-audit
          path: ui-audit/
          if-no-files-found: warn
          retention-days: 14
