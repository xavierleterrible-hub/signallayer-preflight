name: Validate Agent Skill
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: node --check scripts/check-offer.mjs
      - run: node --test scripts/test-offer.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Agent Skills CLI discovery (read-only; no install telemetry)
        env:
          DISABLE_TELEMETRY: '1'
        run: timeout 90s npx --yes skills add xavierleterrible-hub/signallayer-preflight --list
