name: External marketplace visibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit-discovery.mjs"
      - ".github/workflows/discovery-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Query PayAI Bazaar and Official MCP Registry (no SignalLayer/Floot requests)
        run: node scripts/audit-discovery.mjs | tee marketplace-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-audit
          path: marketplace-audit.json
          retention-days: 14
