name: Update existing official MCP Registry entry

on:
  push:
    paths:
      - ".github/workflows/publish-mcp-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: signallayer-official-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and authenticate the public server manifest
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 --max-time 30 \
            --output server.json https://signallayer.floot.app/server.json
          jq -e '
            .name == "io.github.xavierleterrible-hub/signallayer" and
            .version == "2.1.1" and
            (.remotes | any(.type == "streamable-http" and .url == "https://signallayer.floot.app/_api/mcp"))
          ' server.json
          echo "Publishing existing SignalLayer MCP server 2.1.1 only."

      - name: Download official MCP Publisher
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 --max-time 60 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate public MCP server manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate to official MCP Registry (GitHub OIDC; no secrets)
        run: ./mcp-publisher login github-oidc

      - name: Publish version 2.1.1 under existing server name
        run: ./mcp-publisher publish server.json
